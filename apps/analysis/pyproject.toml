[project]
name = "riil-analysis"
version = "0.1.0"
description = "Internal analysis service for Fin Engine"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "pdfplumber>=0.11,<1",
  "polars>=1.34,<2",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.37,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
fin-engine-data = "riil_analysis.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riil_analysis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
