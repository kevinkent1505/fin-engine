name: Fin Engine Python tests

on:
  push:
    branches: ["feature/marketplace-poc", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/analysis/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev,bps_browser]"
      - name: Run offline tests
        run: python -m pytest -q

  tooling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check cross-platform launcher and local environment loader
        run: node --check scripts/fin-engine.mjs && node --test scripts/tests/env-local.test.mjs
