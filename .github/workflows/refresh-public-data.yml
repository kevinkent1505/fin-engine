name: Refresh official public data

on:
  schedule:
    # Monday 02:15 UTC = Monday 09:15 Jakarta; DB freshness determines due sources.
    - cron: "15 2 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore freshness checks (re-fetch all government sources)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: fin-engine-public-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.FIN_ENGINE_DATABASE_URL }}
      BPS_VEHICLE_STOCK_CSV_URL: ${{ secrets.BPS_VEHICLE_STOCK_CSV_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/analysis/pyproject.toml
      - name: Require database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set repository secret FIN_ENGINE_DATABASE_URL (Neon connection string)."
            exit 1
          fi
      - name: Install analysis and public-source browser fallback
        working-directory: apps/analysis
        run: |
          python -m pip install -e ".[bps_browser]"
          python -m playwright install --with-deps chromium
      - name: Refresh due government sources
        working-directory: apps/analysis
        env:
          FORCE: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          if [ "$FORCE" = "true" ]; then
            python -m riil_analysis.cli refresh-data --force
          else
            python -m riil_analysis.cli refresh-data
          fi
